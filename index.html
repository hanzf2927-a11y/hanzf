<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MDV Live</title>
<meta name="description" content="Live-Karte des Zugverkehrs im Mitteldeutschen Verkehrsverbund mit Abfahrtstafeln.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MDV Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* App-Layout: Vollbildkarte, oben schmale Statusleiste, unten Tab-Leiste, darüber ein Blatt (Sheet) für Inhalte */
:root{
  --bg:#0d1117; --panel:#141b24; --panel-2:#1b2430; --line:#2a3647;
  --fg:#e6edf3; --muted:#8b98a9; --accent:#f8b608; --mdvred:#ed1c24; --mdvblue:#3a63c4;
  --ok:#3fb950; --warn:#e3b341; --bad:#f85149;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tabh:58px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f2f4f7; --line:#d9dfe7;
  --fg:#161c24; --muted:#5b6778; --accent:#b07d00; --mdvblue:#244aa5;
  --ok:#1f883d; --warn:#9a6700; --bad:#cf222e; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--body)}
.leaflet-control-attribution{font-size:9px!important;background:color-mix(in srgb,var(--panel) 70%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bottom{bottom:calc(var(--tabh) + var(--sab))}

/* Statusleiste */
#top{position:fixed;z-index:1000;left:0;right:0;top:0;padding:calc(var(--sat) + 6px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 88%,transparent),transparent)}
#top .brand{display:flex;align-items:center;gap:7px;font:700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
#top .brand svg{height:20px;width:auto}
#top .brand span{color:var(--mdvred)}
#top .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#top .dot.live{background:var(--ok);animation:pulse 2s infinite}
#top .dot.err{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.6)}70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
#top .clock{margin-left:auto;font:600 17px/1 var(--mono);font-variant-numeric:tabular-nums}
#top .clock small{font-size:.7em;color:var(--mdvred)}

/* Schwebende Kartenknöpfe */
.fab{position:fixed;z-index:900;right:max(12px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 92%,transparent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.fab svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fab-loc{bottom:calc(var(--tabh) + var(--sab) + 70px)}
#fab-home{bottom:calc(var(--tabh) + var(--sab) + 20px)}

/* Tab-Leiste */
#tabs{position:fixed;z-index:1200;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sab));padding:0 max(6px,env(safe-area-inset-right,0px)) var(--sab) max(6px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--panel) 94%,transparent);border-top:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px/1 var(--body);color:var(--muted);cursor:pointer}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected="true"]{color:var(--fg)}
#tabs button[aria-selected="true"] svg{stroke:var(--mdvred)}

/* Blatt */
#sheet{position:fixed;z-index:1100;left:0;right:0;bottom:calc(var(--tabh) + var(--sab));height:62%;max-height:calc(100% - var(--sat) - var(--tabh) - var(--sab) - 40px);
  background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;
  transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1),height .25s ease}
#sheet.open{transform:translateY(0)}
#sheet.full{height:calc(100% - var(--sat) - var(--tabh) - var(--sab) - 40px)}
#sheet.dragging{transition:none}
#grab{flex:none;padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
#grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
#sheetBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}

.sh-h{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.sh-h h2{margin:0;font:700 24px/1.05 var(--display);flex:1;min-width:0;text-wrap:balance}
.x{border:0;background:var(--panel-2);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);flex:none;cursor:pointer}
.sub{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;font:700 13px/1 var(--display);letter-spacing:.03em;padding:4px 6px 3px;border-radius:4px;white-space:nowrap}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:16px var(--body);margin-bottom:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel-2);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 4px;font:600 13px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border-bottom:0}
.muted{color:var(--muted)}
.late{color:var(--bad)}.slight{color:var(--warn)}.ontime{color:var(--ok)}
.empty{padding:24px 4px;text-align:center;color:var(--muted);font-size:14px}
.sec{font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}

/* Zugliste */
.tl li{grid-template-columns:auto 1fr auto}
.tl .pic{line-height:0}
.tl .dest{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .nx{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .d{font:600 13px var(--mono);text-align:right}
.tl .l1{display:flex;align-items:center;gap:7px;min-width:0}

/* Abfahrtstafel */
.board li{grid-template-columns:52px 1fr auto;align-items:start}
.board .tm{font:600 15px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.board .tm s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.board .dir{font-weight:600;line-height:1.25}
.board .meta2{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.board .gl{text-align:right;font:600 13px var(--mono)}
.board .gl small{display:block;font:500 10px var(--body);color:var(--muted)}
.board .gl.chg{color:var(--warn)}
.board li.canc .dir,.board li.canc .tm{text-decoration:line-through;color:var(--bad)}
.tag{font:600 10.5px/1 var(--body);padding:3px 5px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* Bahnhofsliste */
.stl li{grid-template-columns:auto 1fr auto}
.stl .ring{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--fg)}
.stl .ring.hbf{width:15px;height:15px;border-width:3px}
.stl .km{font:500 12px var(--mono);color:var(--muted)}

/* Zug-Detail */
.photo{position:relative;margin:0 -16px 12px;height:190px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cred{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 5px;font-size:10px;color:#eee;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .cred a{color:#eee}
.vbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);margin:12px 0}
.vbox .vn{display:flex;align-items:center;gap:8px;font:600 17px/1.1 var(--display)}
.vbox .vb{font:500 11px var(--mono);color:var(--muted);margin-top:3px}
.vbox p{margin:6px 0 0;font-size:13px}
.vbox .note{font-size:11.5px;color:var(--muted);margin-top:6px}
.vbox a{color:var(--accent)}
.btnrow{display:flex;gap:8px;margin:10px 0}
.btnrow button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:9px;font:600 13px var(--body);cursor:pointer}
.btnrow button[aria-pressed="true"]{border-color:var(--mdvred);color:var(--mdvred)}
.stops{list-style:none;margin:0;padding:4px 0}
.stops li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;padding:6px 0;align-items:center;font-size:14px;position:relative}
.stops li .tk{width:11px;height:11px;border-radius:50%;border:2px solid var(--muted);background:var(--panel);justify-self:center;z-index:1}
.stops li::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.stops li:first-child::before{top:50%}.stops li:last-child::before{bottom:50%}
.stops li.past{color:var(--muted)}.stops li.past .tk{background:var(--muted)}
.stops li.next .tk{border-color:var(--mdvred);background:var(--mdvred)}
.stops .t{font:500 13px var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.stops .t s{color:var(--muted);margin-right:4px}
.stops .cn{color:var(--bad);text-decoration:line-through}
.stops .stn{cursor:pointer}

/* Einstellungen */
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt input[type=range]{width:55%;accent-color:var(--mdvred)}
.opt .val{font:600 13px var(--mono);min-width:44px;text-align:right}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(18px)}
.about{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
.about a{color:var(--muted)}

/* Kartenobjekte */
.train{position:relative}
.veh{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;padding:2px 3px 1px;border-radius:5px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);border:2px solid var(--dc);box-shadow:0 1px 5px rgba(0,0,0,.5)}
.veh .pic{display:block;line-height:0}
.veh.west .pic{transform:scaleX(-1)}
.veh.west{flex-direction:row-reverse}
.veh .tg{font:700 11px/1 var(--display);letter-spacing:.03em;border-radius:3px;padding:2px 4px 1px;white-space:nowrap}
.pill.mini{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;border:2px solid var(--ok);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.train.sel .veh,.train.sel .pill{outline:2.5px solid var(--fg);outline-offset:3px}
.st-label{background:transparent;border:0;box-shadow:none;color:var(--fg);font:600 12px/1 var(--display);letter-spacing:.04em;padding:0;
  text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg)}
.st-label.hbf{font-size:14px;text-transform:uppercase}
.st-label::before{display:none}
.me{width:16px;height:16px;border-radius:50%;background:#2f81f7;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,129,247,.25)}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Karte des MDV-Zugverkehrs"></div>

<header id="top">
  <div class="brand">
    <svg viewBox="85 0 172 153" aria-hidden="true"><path fill="#ed1c24" d="M88.03,6.55H116.23V14.64C116.3,42.34 138.13,92 168.96,111.28V146.15C121.75,120.4 93.65,69.46 88.87,31.34 87.9,23.64 87.31,10.05 87.31,8.75 87.31,7.46 88.03,6.55 88.03,6.55"/><path fill="#3a63c4" d="M172.9,7.01C226.91,36.52 251.83,90.54 254.03,133.25 254.29,138.89 254.55,140.58 253.87,146.6H225.12V135.29C225.04,106.93 203.7,64.05 172.9,40.83V7.01"/><circle fill="#ed1c24" cx="145.28" cy="21.07" r="18.33"/><circle fill="#3a63c4" cx="197.37" cy="132.02" r="18.33"/></svg>
    MDV <span>Live</span><i class="dot" id="sdot"></i>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<button class="fab" id="fab-loc" aria-label="Meinen Standort zeigen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
<button class="fab" id="fab-home" aria-label="Ganzes Netz zeigen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

<section id="sheet" aria-live="polite">
  <div id="grab" aria-hidden="true"><i></i></div>
  <div id="sheetBody"></div>
</section>

<nav id="tabs" role="tablist">
  <button role="tab" data-tab="map" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Karte</button>
  <button role="tab" data-tab="trains" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2 0M8 17l-2 4M16 17l2 4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></svg>Züge</button>
  <button role="tab" data-tab="stations" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg>Bahnhöfe</button>
  <button role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ansicht</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="mdv-data.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
